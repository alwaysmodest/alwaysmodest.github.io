<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李宗禹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2dba4e, #1a7f37);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 600;
      color: #fff;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 26px;
      color: #f0f6fc;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 15px;
      color: #8b949e;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 15px;
      color: #c9d1d9;
      margin-bottom: 24px;
      line-height: 1.8;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .links a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .links .scholar {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">李</div>
    <h1>李宗禹</h1>
    <div class="subtitle">Modal Logic,Causal Logic</div>
    <p class="bio">
      硕士毕业于北京交通大学，现于广东工业大学攻读博士。<br>
      研究方向：Modal Logic,Causal Logic。
    </p>
    <div class="links">
      <a class="scholar" href="https://scholar.google.com.hk/citations?user=FoE9ckcAAAAJ&hl=zh-CN" target="_blank">谷歌学术</a>
      <a href="mailto:zongyuli@bjtu.edu.cn">zongyuli@bjtu.edu.cn</a>
      <a href="mailto:gdutzongyuli@gmail.com">gdutzongyuli@gmail.com</a>
    </div>
  </div>
</body>
</html>
